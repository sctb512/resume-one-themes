name: Validate and release themes

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: themes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tools/catalog.py --pack dist/Resume-One-Community-Themes.zip
      - name: Verify archive and checksum
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          python -m zipfile -t Resume-One-Community-Themes.zip
      - uses: actions/upload-artifact@v6
        with:
          name: community-themes
          path: dist/
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: community-themes
          path: dist
      - name: Publish the verified theme package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --generate-notes \
            dist/Resume-One-Community-Themes.zip dist/SHA256SUMS index.json packages.json
